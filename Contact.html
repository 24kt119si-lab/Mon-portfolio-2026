    <main>
        <section class="contact-container">
            <div class="contact-info">
                <h2>Me Contacter</h2>
                <p>Besoin d'un développeur passionné pour vos projets ? Je suis disponible pour discuter de vos idées.
                </p>

                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <div>
                        <h3>Localisation</h3>
                        <p>Lubumbashi, Haut-Katanga, RDC</p>
                    </div>
                </div>

                <div class="info-item">
                    <i class=""></i>
                    <div>
                        <h3></h3>
                        <button class="btn-whatsapp"><i class=""></i> Whatsapp</button>
                        <button class="btn-telegram"><i class=""></i> Telegram</button>
                    </div>
                </div>
            </div>

            <div class="contact-form">
                <form action="#">
                    <div class="input-group">
                        <label for="nom">Nom Complet</label>
                        <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
                    </div>

                    <div class="input-group">
                        <label for="tel">Téléphone</label>
                        <input type="tel" id="tel" name="tel" placeholder="+243..." required>
                    </div>

                    <div class="input-group">
                        <label for="message">Message (Optionnel)</label>
                        <textarea id="message" rows="5" placeholder="Votre message..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Envoyer le message</button>
                </form>
            </div>
        </section>
